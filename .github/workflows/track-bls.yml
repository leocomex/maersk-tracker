name: Rastreamento BLs Maersk

on:
  schedule:
    # Roda de segunda a sexta às 8h horário de Brasília (11h UTC)
    - cron: '0 11 * * 1-5'
  workflow_dispatch:
    # Permite rodar manualmente pelo painel do GitHub

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: Rastrear BLs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node track-bls.js
